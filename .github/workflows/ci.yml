name: Backend CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bruna_affonso_ci
      JWT_SECRET: ci_jwt_secret_with_more_than_32_characters_123
      REFRESH_SECRET: ci_refresh_secret_with_more_than_32_chars_456
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Check server imports
        run: node --check src/server.js

      - name: Validate production start command
        run: |
          grep -qx 'web: node src/server.js' Procfile.txt
          test -f src/server.js
