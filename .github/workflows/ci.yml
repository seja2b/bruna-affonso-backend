name: Backend CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bruna_affonso_ci
      JWT_SECRET: ci_jwt_secret_with_more_than_32_characters_123
      REFRESH_SECRET: ci_refresh_secret_with_more_than_32_chars_456
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Test strength calculations and validation
        run: npm test

      - name: Check security-critical imports
        run: |
          node --check src/server.js
          node --check src/controllers/authController.js
          node --check src/services/refreshSessionService.js

      - name: Validate refresh session SQL
        run: |
          test -f prisma/sql/ensure_refresh_sessions.sql
          grep -q 'CREATE TABLE IF NOT EXISTS "RefreshSession"' prisma/sql/ensure_refresh_sessions.sql
          grep -q 'CREATE UNIQUE INDEX IF NOT EXISTS "RefreshSession_tokenHash_key"' prisma/sql/ensure_refresh_sessions.sql

      - name: Validate assessment SQL
        run: |
          test -f prisma/sql/ensure_assessments.sql
          grep -q 'CREATE TABLE IF NOT EXISTS "AssessmentCycle"' prisma/sql/ensure_assessments.sql
          grep -q 'CREATE TABLE IF NOT EXISTS "AssessmentPhoto"' prisma/sql/ensure_assessments.sql

      - name: Validate production start commands
        run: |
          grep -qx 'web: npx prisma db execute --file prisma/sql/ensure_refresh_sessions.sql --schema prisma/schema.prisma && npx prisma db execute --file prisma/sql/ensure_assessments.sql --schema prisma/schema.prisma && node src/server.js' Procfile.txt
          node -e "const p=require('./package.json'); if(!p.scripts.start.includes('prisma/sql/ensure_refresh_sessions.sql')||!p.scripts.start.includes('prisma/sql/ensure_assessments.sql')) process.exit(1)"
          test -f src/server.js

  assessment-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bruna_assessment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bruna_assessment_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bruna_assessment_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Create schema in disposable test database
        run: npx prisma db push
      - name: Test HTTP handlers with PostgreSQL
        run: npm run test:integration
